name: GUI docs

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - ".github/workflows/gui-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  markdown-docs:
    runs-on: ubuntu-latest
    steps:
      - name: TEMP DEBUG - check submodule deploy key secret is set
        env:
          KEY: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SUBMODULE_DEPLOY_KEY is empty or not reaching this workflow (wrong secret name, wrong repo, or an Environment secret not granted to this job)."
            exit 1
          fi
          echo "Secret is present, length: ${#KEY} characters (expect ~400+ for an ed25519 private key block)."
          echo "First line: $(echo "$KEY" | head -n1)"
          echo "Last line: $(echo "$KEY" | tail -n1)"

      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        working-directory: gui
        run: uv sync --group docs

      - name: Generate markdown API reference
        working-directory: gui
        run: |
          uv run --group docs --no-sync lazydocs \
            --output-path docs/reference \
            --src-base-url "https://github.com/${{ github.repository }}/blob/main/" \
            config main riid_service state_engine ml_inference ml_preprocessing \
            view_spectrum_id view_recording view_download view_calibration
        env:
          PYTHONPATH: .

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gui/docs/reference/*.md
          git diff --staged --quiet || git commit -m "docs(gui): regenerate API reference [skip ci]"
          git push
